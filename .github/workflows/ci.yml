# CI/CD del backend hacia Azure Container Apps.
#   push a azure    → imagen <repo>:dev-<sha corto>, push al ACR y deploy (rama de trabajo del TP).
#   push a develop  → imagen <repo>:dev-<sha corto>, push al ACR, SIN deploy.
#   tag v*          → imagen <repo>:<tag> + <repo>:latest, push al ACR y deploy (producción).
# No corre tests (decisión del trabajo práctico).
# Secrets de GitHub: AZURE_CREDENTIALS, ACR_NAME, AZURE_RESOURCE_GROUP, SNYK_TOKEN.
# Los secretos de la app (JWT, DB, Application Insights) viven en el Container App.
name: CI/CD

on:
  push:
    branches: [azure, develop]
    tags: ['v*']
    # Solo cuando cambia código, el Dockerfile o las dependencias. Nota: GitHub no
    # evalúa `paths` en los push de tags, así que un tag v* siempre despliega.
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

# Nunca dos deploys en paralelo sobre el mismo ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTAINER_APP: printops-backend

jobs:
  build-push-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # 2. Análisis Snyk de dependencias (Gradle). Falla con vulnerabilidades altas o críticas.
      - name: Set up JDK 21 (para que Snyk resuelva las dependencias Gradle)
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@v1.0.0

      - name: Snyk — dependencias
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          # Solo el classpath de runtime: es lo que va en la imagen (las dependencias de
          # test no llegan a producción). Cada hallazgo se publica como anotación.
          set +e
          snyk test --severity-threshold=high --configuration-matching='^runtimeClasspath$' | tee snyk-deps.txt
          code=${PIPESTATUS[0]}
          grep -E '✗|Upgrade |Introduced through' snyk-deps.txt | head -40 | while IFS= read -r line; do
            echo "::warning title=Snyk dependencias::${line}"
          done
          exit $code

      # 3. Build de la imagen
      - name: Calcular nombre y tags de la imagen
        id: meta
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          # Nombre del repo en minúscula, sin tildes ni guiones bajos.
          repo="${GITHUB_REPOSITORY#*/}"
          image="$(printf '%s' "$repo" | iconv -f UTF-8 -t ASCII//TRANSLIT | tr '[:upper:]' '[:lower:]' | tr -d '_')"
          registry="${ACR_NAME}.azurecr.io"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tags="${registry}/${image}:${GITHUB_REF_NAME},${registry}/${image}:latest"
            deploy_image="${registry}/${image}:${GITHUB_REF_NAME}"
            deploy=true
          else
            tags="${registry}/${image}:dev-${GITHUB_SHA::7}"
            deploy_image="${registry}/${image}:dev-${GITHUB_SHA::7}"
            # La rama azure despliega cada cambio; develop solo publica la imagen.
            if [[ "$GITHUB_REF_NAME" == "azure" ]]; then deploy=true; else deploy=false; fi
          fi
          {
            echo "image=${image}"
            echo "registry=${registry}"
            echo "tags=${tags}"
            echo "deploy_image=${deploy_image}"
            echo "deploy=${deploy}"
          } >> "$GITHUB_OUTPUT"
          echo "Imagen: ${tags} (deploy: ${deploy})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Snyk — imagen
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk container test "${{ steps.meta.outputs.deploy_image }}" --file=Dockerfile --severity-threshold=high | tee snyk-image.txt
          code=${PIPESTATUS[0]}
          grep -E '✗|Upgrade |Introduced through' snyk-image.txt | head -40 | while IFS= read -r line; do
            echo "::warning title=Snyk imagen::${line}"
          done
          exit $code

      # 4. Push al ACR
      - name: Azure login
        uses: azure/login@v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Push al ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          az acr login --name "$ACR_NAME"
          for tag in ${TAGS//,/ }; do
            docker push "$tag"
          done

      # 5. Deploy a Container Apps (rama azure y tags v*). El Container App ya tiene que
      #    existir (lo crea `scripts/azure.py deploy`, que carga los secretos).
      - name: Deploy a Container Apps
        if: steps.meta.outputs.deploy == 'true'
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          IMAGE: ${{ steps.meta.outputs.deploy_image }}
        run: |
          # Se actualiza vía ARM (az rest) y no con `az containerapp update`: en suscripciones
          # Azure for Students el proveedor Microsoft.App puede quedar en "Registering" y el
          # CLI se niega a operar, aunque ARM acepta los cambios. Solo se toca el template
          # (imagen, recursos y escalado); secretos y variables quedan como están.
          sub="$(az account show --query id -o tsv)"
          url="https://management.azure.com/subscriptions/${sub}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/containerApps/${CONTAINER_APP}?api-version=2024-03-01"
          # Spring Boot: 0.5 vCPU / 1 GiB (con 0.25 / 0.5 GiB la JVM no entra). Escala a cero.
          body="$(az rest --method get --url "$url" --query properties.template -o json \
            | jq -c --arg img "$IMAGE" 'del(.revisionSuffix)
                | .containers[0].image = $img
                | .containers[0].resources = {cpu: 0.5, memory: "1Gi"}
                | .scale.minReplicas = 0 | .scale.maxReplicas = 1
                | {properties: {template: .}}')"
          az rest --method patch --url "$url" --body "$body" \
            --query "{estado: properties.provisioningState, imagen: properties.template.containers[0].image}" -o table

      # 6. Logout siempre, aunque falle un paso anterior.
      - name: Azure logout
        if: always()
        run: az logout || true
