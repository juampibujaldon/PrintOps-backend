name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # RedisDashboardCacheIT usa un Redis real (sin él, ese test se saltea).
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Los tests de integración levantan Postgres con Testcontainers (Docker viene en el runner)
      # y aplican las migraciones de Flyway, así que también validan los scripts.
      - name: Tests
        run: ./gradlew test --no-daemon
        env:
          REDIS_TEST_PORT: "6379"
      - name: Jar ejecutable
        run: ./gradlew bootJar -x test --no-daemon
      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test

  agent:
    name: Agente local (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen (la misma que usa Railway)
        run: docker build -t printops-backend:ci .
