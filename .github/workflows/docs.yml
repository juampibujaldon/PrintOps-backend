name: Docs CI

on:
  pull_request:
    paths:
      - '*.md'
      - '**/*.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [main, develop, azure]
    paths:
      - '*.md'
      - '**/*.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # HEAD^ tiene que existir para el diff (por defecto el checkout baja un solo commit).
          fetch-depth: 2
      - name: Check documentation diff
        run: git diff --check HEAD^ HEAD
