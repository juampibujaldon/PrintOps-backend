# Análisis estático (SAST) del código Java con CodeQL. Los resultados aparecen en
# Security → Code scanning del repositorio.
name: CodeQL

on:
  push:
    branches: [main, develop, azure]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '23 6 * * 1'   # lunes 06:23 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: java-kotlin
          # Sin compilar: CodeQL analiza el código fuente directamente.
          build-mode: none
          queries: security-and-quality

      - name: Analizar
        uses: github/codeql-action/analyze@v4.38.3
        with:
          category: /language:java-kotlin
