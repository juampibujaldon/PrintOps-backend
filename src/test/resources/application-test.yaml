# Perfil SOLO para tests. Nunca apunta a la base de desarrollo: la URL real la
# inyecta IntegrationTestBase desde un contenedor Testcontainers. El placeholder
# de abajo falla rapido si alguien levanta el contexto sin ese contenedor.
spring:
  # Los tests no levantan Redis: cache en memoria con la misma semántica.
  cache:
    type: caffeine
  datasource:
    url: jdbc:postgresql://invalid.invalid:1/printops_test_placeholder
    username: test
    password: test
  # El esquema de los tests sale de las mismas migraciones de Flyway que producción
  # (TestFlywayConfig limpia la base antes de migrar).
  flyway:
    clean-disabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: true

jwt:
  # Clave de prueba (Base64, > 256 bits). No es un secreto real.
  secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=

resend:
  api-key: ""
  log-when-disabled: true

app:
  auth:
    refresh-cookie:
      secure: false
  rate-limit:
    enabled: false
  storage:
    type: local
    local-dir: build/test-uploads
