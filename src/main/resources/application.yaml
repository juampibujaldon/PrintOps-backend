# src/main/resources/application.yaml
spring:
  application:
    name: PrintOps

  # Carga el `.env` de la raíz del proyecto (si existe) como propiedades, así
  # RESEND_API_KEY, DB_PASSWORD, etc. funcionan sin exportarlas en la terminal.
  config:
    import: optional:file:.env[.properties]

  # Sin perfil explícito se usa "dev" (application-dev.yaml, credenciales locales).
  # En producción: SPRING_PROFILES_ACTIVE=prod + DB_PASSWORD y JWT_SECRET reales.
  profiles:
    default: dev

  # US-06: habilita la ejecución del scheduler de mantenimiento preventivo.
  task:
    scheduling:
      enabled: true

  # FIX 2: cache real con TTL (Caffeine) para el dashboard de métricas.
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=5m

  # 12-factor: la base se configura por entorno. En Azure, DB_URL apunta al
  # PostgreSQL Flexible Server (con ?sslmode=require).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/printops}
    username: ${DB_USERNAME:printops}
    # Sin default: fuera de "dev" tiene que venir de la variable de entorno.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # HikariCP (pool por defecto de Spring Boot), chico: una sola réplica y un
    # servidor B1ms con pocas conexiones disponibles.
    hikari:
      pool-name: printops-pool
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  # Arranque más rápido (factor IX): los repositorios JPA se inicializan en segundo plano.
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  # Apagado elegante: ante SIGTERM se dejan de aceptar requests y se espera a
  # que terminen las que están en curso, hasta 20 s.
  lifecycle:
    timeout-per-shutdown-phase: 20s

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # FIX 10: evita N+1 cargando colecciones lazy (parts/photos) en lotes.
        default_batch_fetch_size: 50

  # ERR-03: habilitar y dimensionar la subida de archivos multipart/form-data.
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  # Clave base64 de al menos 256 bits para HMAC-SHA256. Sin default: fuera de
  # "dev" tiene que venir de la variable de entorno JWT_SECRET.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}  # 15 minutos en ms
  refresh-expiration: 604800000         # 7 días en ms
  refresh-expiration-remember: 2592000000  # 30 días en ms

server:
  port: ${PORT:8083}
  shutdown: graceful

# Actuator: solo /health, sin autenticación y sin detalles internos.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # Sin los grupos liveness/readiness: con escala a cero, el request que despierta la
      # app llegaba antes de que Spring se marcara "ready" y /health respondía 503. Así
      # /health refleja la app y la base (que ya está conectada cuando Tomcat atiende).
      probes:
        enabled: false

app:
  # URL pública del backend, usada para armar el magic link de verificación.
  base-url: ${APP_BASE_URL:http://localhost:8083}
  metrics:
    # Tarifa horaria del operario para el costo de mano de obra del dashboard (US-08).
    operator-hourly-rate: ${METRICS_OPERATOR_HOURLY_RATE:20.0}


resend:
  # API key de Resend (no commitear el valor real; usar variable de entorno).
  api-key: ${RESEND_API_KEY:}
  # Remitente. Para pruebas podés usar el dominio de Resend "onboarding@resend.dev".
  from: ${RESEND_FROM:PrintOps <onboarding@resend.dev>}
  # Sin API key, el contenido de los emails (códigos incluidos) se escribe en el
  # log para poder probar los flujos en desarrollo. En producción: false.
  log-when-disabled: ${EMAIL_LOG_WHEN_DISABLED:false}
