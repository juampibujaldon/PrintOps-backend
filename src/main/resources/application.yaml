# src/main/resources/application.yaml
spring:
  application:
    name: PrintOps

  # Carga el `.env` de la raíz del proyecto (si existe) como propiedades, así
  # RESEND_API_KEY, DB_PASSWORD, etc. funcionan sin exportarlas en la terminal.
  config:
    import: optional:file:.env[.properties]

  # Sin perfil explícito se usa "dev" (application-dev.yaml, credenciales locales).
  # En producción: SPRING_PROFILES_ACTIVE=prod + DB_PASSWORD y JWT_SECRET reales.
  profiles:
    default: dev

  # US-06: habilita la ejecución del scheduler de mantenimiento preventivo.
  task:
    scheduling:
      enabled: true

  # Cache del dashboard de métricas: Redis (compartida entre instancias, sobrevive a
  # los redeploys). Config de serialización/TTL en RedisCacheConfig. En dev y test se
  # usa Caffeine en memoria (ver application-dev.yaml); se puede forzar con CACHE_TYPE.
  cache:
    type: ${CACHE_TYPE:redis}
    caffeine:
      spec: maximumSize=100,expireAfterWrite=5m

  data:
    redis:
      # Railway expone REDIS_URL (redis://default:<pass>@<host>:<puerto>).
      url: ${REDIS_URL:redis://localhost:6379}
      # Timeouts cortos: si Redis no responde, el dashboard se calcula sin cache
      # en vez de colgarse 60 s (default de Lettuce).
      timeout: 2s
      connect-timeout: 2s
      # Redis es solo cache: sin repositorios Spring Data Redis (los repos son JPA).
      repositories:
        enabled: false

  datasource:
    # En la nube: DB_URL=jdbc:postgresql://<host>:<puerto>/<base> (formato JDBC, no postgres://).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/printops}
    username: ${DB_USERNAME:printops}
    # Sin default: fuera de "dev" tiene que venir de la variable de entorno.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Sin sesion abierta durante el render de la vista: la conexion vuelve al pool al
    # terminar el servicio y cualquier acceso lazy fuera de una transaccion falla en vez
    # de ejecutar consultas ocultas desde el controller / serializador.
    open-in-view: false
    hibernate:
      # El esquema lo manejan las migraciones de Flyway (db/migration). Hibernate solo
      # valida que las entidades coincidan con las tablas y no arranca si no.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # FIX 10: evita N+1 cargando colecciones lazy (parts/photos) en lotes.
        default_batch_fetch_size: 50

  flyway:
    # Bases creadas antes de Flyway (por ddl-auto) se marcan como V1 sin ejecutarla.
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  # ERR-03: habilitar y dimensionar la subida de archivos multipart/form-data.
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  # Clave base64 de al menos 256 bits para HMAC-SHA256. Sin default: fuera de
  # "dev" tiene que venir de la variable de entorno JWT_SECRET.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}  # 15 minutos en ms
  refresh-expiration: 604800000         # 7 días en ms
  refresh-expiration-remember: 2592000000  # 30 días en ms

server:
  # Las plataformas (Railway, Render...) asignan el puerto en PORT.
  port: ${PORT:8083}
  # Detrás del proxy de Railway (TLS terminado afuera): sin esto las URLs generadas
  # (fotos, links) salían con http:// y el navegador las bloqueaba por mixed content.
  forward-headers-strategy: native
  # Respuestas JSON/texto >= 1 KB viajan comprimidas (gzip) si el cliente lo acepta.
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

app:
  # URL pública del backend, usada para armar el magic link de verificación.
  base-url: ${APP_BASE_URL:http://localhost:8083}
  # Orígenes permitidos por CORS y por el WebSocket, separados por coma
  # (p. ej. https://printops.vercel.app,http://localhost:5173). "*" = cualquiera.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # Archivos subidos (fotos de órdenes e impresoras).
  # - s3: bucket privado S3/R2 con URLs prefirmadas (recomendado en Railway: el disco del
  #   contenedor se borra en cada deploy).
  # - local: carpeta en disco + URLs firmadas con HMAC servidas por /api/files. En Railway
  #   solo sirve con un Volume montado en STORAGE_LOCAL_DIR.
  # - none (default en producción): no se pueden subir fotos ni logos; el front los oculta.
  storage:
    type: ${STORAGE_TYPE:none}
    url-ttl: ${STORAGE_URL_TTL:PT1H}
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
    s3:
      bucket: ${S3_BUCKET:}
      # R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com · AWS: vacío (usa la región).
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  auth:
    # Cookie httpOnly del refresh token (no la puede leer JavaScript: protege contra XSS).
    # Requiere que el front y la API compartan origen (proxy de nginx del front).
    refresh-cookie:
      name: printops_rt
      secure: ${AUTH_COOKIE_SECURE:true}
  # Límites por IP (y por email en login) para endpoints públicos sensibles.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  # URL pública del front, para armar links compartibles (presupuestos públicos).
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  metrics:
    # Tarifa horaria del operario para el costo de mano de obra del dashboard (US-08).
    operator-hourly-rate: ${METRICS_OPERATOR_HOURLY_RATE:20.0}


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Readiness (lo que mira Railway en cada deploy) depende solo de la base: si Redis
    # se cae la app sigue funcionando sin cache, no tiene sentido sacarla de servicio.
    redis:
      enabled: false

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html

google:
  # Client IDs de OAuth aceptados como audience del ID token (separados por coma):
  # el de la app web y, si corresponde, el de iOS. Vacio = login con Google deshabilitado (503).
  client-ids: ${GOOGLE_CLIENT_IDS:501380806934-812jqumdo68npmgul1j4ontisbjl00p9.apps.googleusercontent.com}

resend:
  # API key de Resend (no commitear el valor real; usar variable de entorno).
  api-key: ${RESEND_API_KEY:}
  # Remitente. Para pruebas podés usar el dominio de Resend "onboarding@resend.dev".
  from: ${RESEND_FROM:PrintOps <onboarding@resend.dev>}
  # Sin API key, el contenido de los emails (códigos incluidos) se escribe en el
  # log para poder probar los flujos en desarrollo. En producción: false.
  log-when-disabled: ${EMAIL_LOG_WHEN_DISABLED:false}
