# src/main/resources/application.yaml
spring:
  application:
    name: PrintOps

  # US-06: habilita la ejecución del scheduler de mantenimiento preventivo.
  task:
    scheduling:
      enabled: true

  # FIX 2: cache real con TTL (Caffeine) para el dashboard de métricas.
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=5m

  datasource:
    url: jdbc:postgresql://localhost:5432/printops
    username: printops
    password: ${DB_PASSWORD:GoodNews}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # FIX 10: evita N+1 cargando colecciones lazy (parts/photos) en lotes.
        default_batch_fetch_size: 50

  # ERR-03: habilitar y dimensionar la subida de archivos multipart/form-data.
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  # Clave base64 de al menos 256 bits para HMAC-SHA256 (desde variable de entorno).
  secret: ${JWT_SECRET:a_very_long_super_secret_key_for_jwt_signing_which_needs_to_be_256_bits}
  expiration: ${JWT_EXPIRATION:900000}  # 15 minutos en ms
  refresh-expiration: 604800000         # 7 días en ms
  refresh-expiration-remember: 2592000000  # 30 días en ms

server:
  port: 8083

app:
  # URL pública del backend, usada para armar el magic link de verificación.
  base-url: ${APP_BASE_URL:http://localhost:8083}
  metrics:
    # Tarifa horaria del operario para el costo de mano de obra del dashboard (US-08).
    operator-hourly-rate: ${METRICS_OPERATOR_HOURLY_RATE:20.0}
  firebase:
    # Ruta al service account JSON de Firebase Admin (notificaciones push, US-05).
    # Si no se define, el push queda deshabilitado y solo funcionan las notificaciones in-app.
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

resend:
  # API key de Resend (no commitear el valor real; usar variable de entorno).
  api-key: ${re_FEAXDNmg_MyaSKi2Rh5vQkJeLHvsk8tBp:}
  # Remitente. Para pruebas podés usar el dominio de Resend "onboarding@resend.dev".
  from: ${RESEND_FROM:PrintOps <onboarding@resend.dev>}
